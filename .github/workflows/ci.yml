name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalacja
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Testy
        run: pytest --cov=krakenbot --cov-report=term-missing
