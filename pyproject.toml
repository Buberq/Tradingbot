[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "krakenbot"
version = "0.1.0"
description = "Bot tradingowy na rynek SPOT Kraken (pary do EUR) z dwoma agentami LLM i Risk Managerem w kodzie"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
krakenbot = "krakenbot.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert w testach jest w porządku

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
